name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - '**/*.cs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout docfx-gitbook-template
        uses: actions/checkout@v4
        with:
          repository: HYMMA/docfx-gitbook-template
          path: docs/templates/gitbook

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup DocFX
        run: dotnet tool install -g docfx

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Restore NuGet packages
        run: nuget restore hymma.solidworks.sln

      - name: Build solution (for XML docs)
        run: msbuild hymma.solidworks.sln -p:Configuration=Release -p:GenerateDocumentationFile=true '-p:DocumentationFile=bin\Release\$(AssemblyName).xml' -nologo -v:minimal

      - name: Build documentation
        working-directory: docs
        run: docfx docfx.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
