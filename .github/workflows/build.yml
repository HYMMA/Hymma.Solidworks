name: Build and Publish Hymma.Solidworks

on:
  pull_request:
    branches:
    - '*'
  push:
    branches:
    - master
    - main
    tags:
    - 'v*'

env:
    NugetDirectory: ${{ github.workspace}}\nugets
    InstallerDirectory: ${{ github.workspace}}\installers

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build
    runs-on: windows-2022
    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
       vs-version: '[17.0,18.0)'

    - name: Extract version from tag
      id: version
      run: |
        # Assembly/NuGet version format: 2018.MINOR.PATCH (SemVer with 2018 as major for SolidWorks API year)
        # Tag format: v2018.0.1 -> extracts 2018.0.1 for assemblies
        # MSI Installer version: Separate scheme (Major.Minor.Patch where Major < 256)
        # MSI version is derived: 2018.X.Y -> 1.X.Y (strip the 2018 prefix)
        if ("${{ github.ref }}" -match "refs/tags/v(.+)") {
          $version = $matches[1]
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "IS_RELEASE=true" >> $env:GITHUB_OUTPUT

          # Extract MSI-compatible version (Minor.Patch.0 from 2018.Minor.Patch)
          if ($version -match "^2018\.(\d+)\.(\d+)") {
            $msiVersion = "1.$($matches[1]).$($matches[2])"
          } else {
            $msiVersion = "1.0.0"
          }
          echo "MSI_VERSION=$msiVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Release build - Assembly version: $version, MSI version: $msiVersion"
        } else {
          # Development build version
          echo "VERSION=2018.0.0" >> $env:GITHUB_OUTPUT
          echo "MSI_VERSION=1.0.0" >> $env:GITHUB_OUTPUT
          echo "IS_RELEASE=false" >> $env:GITHUB_OUTPUT
          Write-Host "Development build - Assembly version: 2018.0.0, MSI version: 1.0.0"
        }

    - name: Update AssemblyInfo versions
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $assemblyVersion = "$version.0"  # 2018.3.3 -> 2018.3.3.0

        $assemblyInfoFiles = @(
          "Interop\Properties\AssemblyInfo.cs",
          "Extensions\Properties\AssemblyInfo.cs",
          "Addins\Properties\AssemblyInfo.cs",
          "Addins.Fluent\Properties\AssemblyInfo.cs"
        )

        foreach ($file in $assemblyInfoFiles) {
          Write-Host "Updating $file to version $assemblyVersion"
          $content = Get-Content $file -Raw
          $content = $content -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$assemblyVersion`")"
          $content = $content -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$assemblyVersion`")"
          Set-Content $file -Value $content -NoNewline
        }

    - name: Build solution
      run: |
        msbuild hymma.solidworks.sln -restore -nologo `
          -p:Configuration=Release `
          -p:RestorePackagesConfig=true `
          -p:InstallerVersion=${{ steps.version.outputs.MSI_VERSION }} `
          -p:AddinGuid='{2EB85AF6-DB51-46FB-B955-D4A7708DA315}'

    - name: Setup VSTest.console.exe
      uses: darenm/Setup-VSTest@v1.3

    - name: Run tests
      run: vstest.console.exe /TestCaseFilter:"TestCategory=Framework" ${{github.workspace}}\UnitTestProject\bin\Release\UnitTestProject.dll

    - name: Create NuGet packages
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $nugetDir = "${{ env.NugetDirectory }}"

        # Create nugets directory
        New-Item -ItemType Directory -Force -Path $nugetDir | Out-Null

        # Package order matters for dependencies:
        # 1. Interop (no dependencies)
        # 2. Extensions (depends on Interop)
        # 3. Addins (depends on Interop)
        # 4. Addins.Fluent (depends on Addins)

        $packages = @(
          @{ Path = "Interop"; Nuspec = "nugetSpec.nuspec"; Symbols = $false },
          @{ Path = "Extensions"; Nuspec = "nugetSpec.nuspec"; Symbols = $true },
          @{ Path = "Addins"; Nuspec = "nugetSpec.nuspec"; Symbols = $true },
          @{ Path = "Addins.Fluent"; Nuspec = "nugetSpec.nuspec"; Symbols = $true }
        )

        foreach ($pkg in $packages) {
          $nuspecPath = Join-Path $pkg.Path $pkg.Nuspec
          Write-Host "Packing $nuspecPath with version $version"

          # Update dependency versions in nuspec to match current version
          $nuspecContent = Get-Content $nuspecPath -Raw
          $nuspecContent = $nuspecContent -replace 'id="Hymma\.Solidworks\.(Interop|Addins|Extensions)"(\s+)version="[^"]+"', "id=`"Hymma.Solidworks.`$1`"`$2version=`"$version`""
          Set-Content $nuspecPath -Value $nuspecContent -NoNewline

          Push-Location $pkg.Path
          if ($pkg.Symbols) {
            nuget pack $pkg.Nuspec -OutputDirectory $nugetDir -Version $version -Properties Configuration=Release -Symbols -SymbolPackageFormat snupkg
          } else {
            nuget pack $pkg.Nuspec -OutputDirectory $nugetDir -Version $version -Properties Configuration=Release
          }
          Pop-Location
        }

    - name: Save NuGet packages
      uses: actions/upload-artifact@v4
      with:
         name: nugets
         path: ${{ env.NuGetDirectory}}/*.*nupkg

    - name: Save sample installer
      uses: actions/upload-artifact@v4
      with:
         name: sample-installer
         path: ${{ github.workspace }}\Samples\QRifyInstaller\bin\x64\Release\**\*.msi

    - name: Publish NuGet (on tag)
      if: github.repository_owner == 'HYMMA' && startsWith(github.ref, 'refs/tags/v')
      run: |
            foreach($file in (Get-ChildItem "${{ env.NuGetDirectory}}" -Recurse -Include Hymma.Solidworks.*.*nupkg )){
            nuget push $file -ApiKey "${{ secrets.NUGET_APIKEY}}" -src https://api.nuget.org/v3/index.json -SkipDuplicate}

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          ${{ env.NuGetDirectory }}/*.nupkg
          ${{ github.workspace }}/Samples/QRifyInstaller/bin/x64/Release/**/*.msi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
